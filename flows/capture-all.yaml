appId: com.ef.campusconnect
---
# HOME
- tapOn: "Home\nTab 1 of 5"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/10-home-top
- scroll
- waitForAnimationToEnd
- takeScreenshot: screenshots/11-home-mid
- scroll
- waitForAnimationToEnd
- takeScreenshot: screenshots/12-home-bottom

