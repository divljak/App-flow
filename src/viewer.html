<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" />

<link rel="stylesheet" href="https://esm.sh/reactflow@11.11.4/dist/style.css" />

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "reactflow": "https://esm.sh/reactflow@11.11.4?deps=react@18.3.1,react-dom@18.3.1",
    "dagre": "https://esm.sh/dagre@0.8.5",
    "htm": "https://esm.sh/htm@3.1.1",
    "htm/react": "https://esm.sh/htm@3.1.1/react?deps=react@18.3.1"
  }
}
</script>

<style>
/* {{STYLES}} */
</style>

<script>
/* {{FLOW_DATA}} */
</script>
</head>
<body>

<header class="specimen">
  <h1>Flow Map</h1>
  <div class="meta">
    <span id="meta-source"></span>
    <span class="accent"> · </span>
    <span id="meta-screens"></span>
  </div>
  <div id="layout-toggle" class="layout-toggle"></div>
</header>

<div id="canvas"></div>

<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import ReactFlow, {
  Background,
  Controls,
  MarkerType,
  ReactFlowProvider,
  useReactFlow,
  Handle,
  Position,
} from 'reactflow';
import htm from 'htm';

const html = htm.bind(React.createElement);

// Populate header meta
document.getElementById('meta-source').textContent = FLOW_DATA.meta.source;
document.getElementById('meta-screens').textContent = `${FLOW_DATA.meta.screens} screens`;

// Custom node: a screen card.
function ScreenNode({ data }) {
  return html`
    <div class="screen-card">
      <div class="label">
        <span class="name">${data.name}</span>
        <span class="index">${data.indexLabel}</span>
      </div>
      <div class="frame">
        <img src=${data.image} alt=${data.name} draggable="false" />
      </div>
      <${Handle} type="target" position=${Position.Left} />
      <${Handle} type="source" position=${Position.Right} />
    </div>
  `;
}

// Section row label (non-interactive, sits left of each row).
function SectionNode({ data }) {
  return html`<div class="section-header">${data.label}</div>`;
}

const nodeTypes = { screen: ScreenNode, section: SectionNode };

// Layout constants
const NODE_W = 224;   // 200 card + 12 padding × 2
const NODE_H = 520;   // approximate card height
const NODE_SEP = 40;  // horizontal gap between cards in a row
const ROW_GAP = 100;  // vertical gap between rows
const HEADER_W = 240; // section label column width

// Map leading digit of screen name → row label. Falls back to the digit itself
// if not in the table, so unknown sections still get their own row.
const SECTION_NAMES = {
  '1': 'HOME',
  '2': 'MY TRIP',
  '3': 'SCHEDULE',
  '4': 'PROFILE',
  '5': 'PROFILE — sub-flows',
  '6': 'HELP',
};

function deriveSection(name) {
  const m = /^(\d)/.exec(name);
  return m ? m[1] : '_';
}

// Generic row layout. `keyFn` returns the row key for each node (a string).
// `labelFn` returns the human label for that row key.
function layoutByRows(nodes, keyFn, labelFn) {
  const groups = new Map();
  for (const n of nodes) {
    const key = keyFn(n);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(n);
  }

  const positioned = [];
  const headers = [];
  let row = 0;
  for (const [key, list] of groups) {
    const y = row * (NODE_H + ROW_GAP);
    headers.push({
      id: `__row-${key}`,
      type: 'section',
      data: { label: labelFn(key) },
      position: { x: -HEADER_W - 20, y },
      draggable: false,
      selectable: false,
    });
    list.forEach((n, i) => {
      positioned.push({ ...n, position: { x: i * (NODE_W + NODE_SEP), y } });
    });
    row++;
  }
  return [...headers, ...positioned];
}

function layoutBySections(nodes) {
  return layoutByRows(
    nodes,
    (n) => deriveSection(n.data.name),
    (key) => SECTION_NAMES[key] || `SECTION ${key}`
  );
}

function layoutByFlow(nodes) {
  return layoutByRows(
    nodes,
    (n) => n.data.flow || '— unspecified —',
    (key) => key
  );
}

// Per-screen-name occurrence index, so duplicates get a #2, #3 suffix in the label.
function withOccurrenceLabels(rawNodes) {
  const counts = {};
  return rawNodes.map((n) => {
    counts[n.name] = (counts[n.name] || 0) + 1;
    const indexLabel = counts[n.name] > 1 ? `#${counts[n.name]}` : '';
    return { ...n, indexLabel };
  });
}

const labeledRaw = withOccurrenceLabels(FLOW_DATA.nodes);

const baseScreenNodes = labeledRaw.map((n) => ({
  id: n.id,
  type: 'screen',
  data: { name: n.name, image: n.image, indexLabel: n.indexLabel, flow: n.flow },
  position: { x: 0, y: 0 },
}));

const styledEdges = FLOW_DATA.edges.map((e) => ({
  id: e.id,
  source: e.source,
  target: e.target,
  label: e.label,
  type: 'smoothstep',
  labelBgPadding: [6, 4],
  labelBgBorderRadius: 4,
  markerEnd: { type: MarkerType.ArrowClosed, color: '#c8503c' },
}));

const LAYOUTS = {
  section: { label: 'By section', fn: layoutBySections },
  flow:    { label: 'By flow',    fn: layoutByFlow },
};

function App() {
  const rf = useReactFlow();
  const [mode, setMode] = React.useState('section');
  const positionedNodes = React.useMemo(() => LAYOUTS[mode].fn(baseScreenNodes), [mode]);

  React.useEffect(() => {
    const id = requestAnimationFrame(() => rf.fitView({ padding: 0.15, duration: 400 }));
    return () => cancelAnimationFrame(id);
  }, [mode]);

  // Render the toggle into the header slot we set up in the body.
  React.useEffect(() => {
    const slot = document.getElementById('layout-toggle');
    if (!slot) return;
    slot.innerHTML = '';
    Object.entries(LAYOUTS).forEach(([key, def]) => {
      const btn = document.createElement('button');
      btn.className = 'layout-toggle-btn' + (mode === key ? ' active' : '');
      btn.textContent = def.label;
      btn.onclick = () => setMode(key);
      slot.appendChild(btn);
    });
  }, [mode]);

  return html`
    <${ReactFlow}
      nodes=${positionedNodes}
      edges=${styledEdges}
      nodeTypes=${nodeTypes}
      proOptions=${{ hideAttribution: false }}
      minZoom=${0.05}
      maxZoom=${1.5}
      nodesDraggable=${true}
      panOnDrag
      zoomOnScroll
    >
      <${Background} variant="dots" gap=${24} size=${1.2} color="#d8cfb8" />
      <${Controls} showInteractive=${false} />
    <//>
  `;
}

createRoot(document.getElementById('canvas')).render(
  html`<${ReactFlowProvider}><${App} /><//>`
);
</script>

</body>
</html>
