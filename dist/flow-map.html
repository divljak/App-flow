<style>
:root {
  --paper: #f7f1e3;
  --paper-edge: #efe7d2;
  --dot: #d8cfb8;
  --ink: #1a1a1a;
  --ink-muted: rgba(26, 26, 26, 0.55);
  --card: #ffffff;
  --card-shadow: 0 4px 16px rgba(20, 20, 20, 0.06), 0 1px 2px rgba(20, 20, 20, 0.04);
  --vermilion: #c8503c;
  --vermilion-faded: rgba(200, 80, 60, 0.55);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
}

header.specimen {
  padding: 28px 36px 18px;
  border-bottom: 1px solid var(--paper-edge);
  display: flex;
  align-items: baseline;
  gap: 24px;
  background: var(--paper);
  z-index: 2;
}

header.specimen h1 {
  margin: 0;
  font-family: 'Fraunces', 'Times New Roman', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 44px;
  letter-spacing: -0.5px;
  line-height: 1;
}

header.specimen .meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 1.2px;
}

header.specimen .accent {
  color: var(--vermilion);
}

#canvas {
  flex: 1;
  min-height: 0;
  position: relative;
}

/* Screen card */
.screen-card {
  width: 200px;
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--card-shadow);
  padding: 12px 12px 10px;
  border: 1px solid transparent;
  transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
  font-family: 'JetBrains Mono', monospace;
}

.screen-card:hover,
.react-flow__node.selected .screen-card {
  border-color: var(--vermilion);
  box-shadow: 0 6px 20px rgba(200, 80, 60, 0.12), 0 1px 2px rgba(20, 20, 20, 0.05);
}

.screen-card .label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.screen-card .label .name {
  color: var(--ink);
  letter-spacing: 0.5px;
}

.screen-card .label .index {
  color: var(--vermilion-faded);
}

.screen-card .frame {
  width: 100%;
  aspect-ratio: 390 / 844;
  background: #111;
  border-radius: 8px;
  overflow: hidden;
  display: block;
}

.screen-card .frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* React Flow overrides */
.react-flow__node {
  cursor: default;
}

.react-flow__handle {
  width: 6px;
  height: 6px;
  background: var(--vermilion-faded);
  border: none;
}

.react-flow__edge-path {
  stroke: var(--vermilion-faded);
  stroke-width: 1.4;
}

.react-flow__edge.selected .react-flow__edge-path,
.react-flow__edge:hover .react-flow__edge-path {
  stroke: var(--vermilion);
  stroke-width: 1.8;
}

.react-flow__edge-text {
  font-family: 'JetBrains Mono', monospace !important;
  font-size: 10px !important;
  fill: var(--ink) !important;
}

.react-flow__edge-textbg {
  fill: var(--paper) !important;
}

.react-flow__arrowhead polyline,
.react-flow__arrowhead path {
  fill: var(--vermilion-faded);
  stroke: var(--vermilion-faded);
}

.react-flow__controls {
  box-shadow: var(--card-shadow);
  border-radius: 8px;
  overflow: hidden;
}

.react-flow__controls-button {
  background: var(--card);
  border-bottom: 1px solid var(--paper-edge);
  color: var(--ink);
}

.react-flow__controls-button:hover {
  background: var(--paper);
  color: var(--vermilion);
}

.react-flow__attribution {
  background: transparent;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink-muted);
}

</style>

<body>

<header class="specimen">
  <h1>Flow Map</h1>
  <div class="meta">
    <span id="meta-source"></span>
    <span class="accent"> · </span>
    <span id="meta-screens"></span>
  </div>
</header>

<div id="canvas"></div>

<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import ReactFlow, {
  Background,
  Controls,
  MarkerType,
  ReactFlowProvider,
  useReactFlow,
  Handle,
  Position,
} from 'reactflow';
import dagre from 'dagre';
import htm from 'htm';

const html = htm.bind(React.createElement);

// Populate header meta
document.getElementById('meta-source').textContent = FLOW_DATA.meta.source;
document.getElementById('meta-screens').textContent = `${FLOW_DATA.meta.screens} screens`;

// Custom node: a screen card.
function ScreenNode({ data }) {
  return html`
    <div class="screen-card">
      <div class="label">
        <span class="name">${data.name}</span>
        <span class="index">${data.indexLabel}</span>
      </div>
      <div class="frame">
        <img src=${data.image} alt=${data.name} draggable="false" />
      </div>
      <${Handle} type="target" position=${Position.Left} />
      <${Handle} type="source" position=${Position.Right} />
    </div>
  `;
}

const nodeTypes = { screen: ScreenNode };

// Dagre layout, left-to-right.
const NODE_W = 224;   // 200 card + 12 padding × 2
const NODE_H = 520;   // approximate measured card height
const RANK_SEP = 96;
const NODE_SEP = 40;

function layoutLR(nodes, edges) {
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'LR', nodesep: NODE_SEP, ranksep: RANK_SEP, marginx: 40, marginy: 40 });
  g.setDefaultEdgeLabel(() => ({}));
  for (const n of nodes) g.setNode(n.id, { width: NODE_W, height: NODE_H });
  for (const e of edges) g.setEdge(e.source, e.target);
  dagre.layout(g);
  return nodes.map((n) => {
    const { x, y } = g.node(n.id);
    return { ...n, position: { x: x - NODE_W / 2, y: y - NODE_H / 2 } };
  });
}

// Per-screen-name occurrence index, so duplicates get a #2, #3 suffix in the label.
function withOccurrenceLabels(rawNodes) {
  const counts = {};
  return rawNodes.map((n) => {
    counts[n.name] = (counts[n.name] || 0) + 1;
    const indexLabel = counts[n.name] > 1 ? `#${counts[n.name]}` : '';
    return { ...n, indexLabel };
  });
}

const labeledRaw = withOccurrenceLabels(FLOW_DATA.nodes);

const positionedNodes = layoutLR(
  labeledRaw.map((n) => ({
    id: n.id,
    type: 'screen',
    data: { name: n.name, image: n.image, indexLabel: n.indexLabel },
    position: { x: 0, y: 0 },
  })),
  FLOW_DATA.edges
);

const styledEdges = FLOW_DATA.edges.map((e) => ({
  id: e.id,
  source: e.source,
  target: e.target,
  label: e.label,
  type: 'smoothstep',
  labelBgPadding: [6, 4],
  labelBgBorderRadius: 4,
  markerEnd: { type: MarkerType.ArrowClosed, color: '#c8503c' },
}));

function App() {
  const flow = useReactFlow();
  React.useEffect(() => {
    const id = requestAnimationFrame(() => flow.fitView({ padding: 0.15, duration: 400 }));
    return () => cancelAnimationFrame(id);
  }, []);
  return html`
    <${ReactFlow}
      nodes=${positionedNodes}
      edges=${styledEdges}
      nodeTypes=${nodeTypes}
      proOptions=${{ hideAttribution: false }}
      minZoom=${0.1}
      maxZoom=${1.5}
      nodesDraggable=${true}
      panOnDrag
      zoomOnScroll
    >
      <${Background} variant="dots" gap=${24} size=${1.2} color="#d8cfb8" />
      <${Controls} showInteractive=${false} />
    <//>
  `;
}

createRoot(document.getElementById('canvas')).render(
  html`<${ReactFlowProvider}><${App} /><//>`
);
</script>
